<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100b17">
  <title>珍奶工坊・合成預覽</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f9eed9;background:#100b17}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse at 65% 28%,#3d2540 0,#191321 47%,#0d0b12 100%)}
    button{font:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #ffdc8f;outline-offset:2px}
    .app{max-width:1440px;min-height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}
    header{min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    h1{margin:0;color:#f8dda5;font-size:clamp(16px,2.1vw,23px);letter-spacing:.07em;text-shadow:0 2px 12px #e0a24a42}
    .subtle{font-size:11px;color:#baa9b4;white-space:nowrap}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.37fr) minmax(320px,1fr);gap:10px}
    .panel{min-width:0;min-height:0;border:1px solid #b18b5d67;border-radius:16px;background:linear-gradient(150deg,#2c2031ed,#16111fee);box-shadow:inset 0 1px #fff3d51a,0 14px 34px #05020a70;overflow:hidden}
    .ingredients{padding:10px 12px;display:flex;flex-direction:column;gap:5px}.top-shelves{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shelf{min-width:0}
    .shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-height:19px}h2{margin:0;color:#f1d5a4;font-size:13px}.rule{font-size:10px;color:#a99caa;white-space:nowrap}
    .choice-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.topping-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px 6px;align-content:start}
    .pick{min-width:0;min-height:69px;padding:4px 2px;border-radius:9px;border:1px solid #6f596b;background:linear-gradient(#302438,#211a29);color:#f5eade;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
    .pick:hover{transform:translateY(-2px);border-color:#e6b973}.pick:disabled{cursor:default;opacity:.7}.pick[aria-pressed=true]{border-color:#ffdb8c;box-shadow:0 0 0 1px #ffc56f,0 0 15px #e7a04388;background:linear-gradient(#4c303d,#2d2134)}
    .pick-art{flex:0 0 auto;width:43px;height:57px;background-image:var(--art-url);background-size:var(--art-size);background-position:var(--art-x) var(--art-y);background-repeat:no-repeat;border-radius:5px;box-shadow:0 2px 8px #0008}.pick-name{min-width:0;font-size:11px;font-weight:700;line-height:1.15;word-break:keep-all;text-align:center}
    .topping-grid .pick{flex-direction:column;gap:2px;min-height:72px;padding:3px 1px}.topping-grid .pick-art{width:39px;height:49px}.topping-grid .pick-name{font-size:10px}
    .result{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:8px 10px;gap:5px}.recipe{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:25px}.slot{padding:3px 7px;border:1px solid #ac836b99;border-radius:999px;background:#3a293b;color:#f2dfc7;font-size:10px;white-space:nowrap}.slot.empty{color:#ab9aab;border-style:dashed}
    .studio{position:relative;min-height:0;overflow:hidden;border-radius:13px;border:1px solid #9a6c4970;background:radial-gradient(ellipse at 39% 40%,#4d3348 0,#2a1c32 48%,#171321 100%);isolation:isolate}
    .studio:before{content:"";position:absolute;inset:-30% 35% 8% -24%;background:linear-gradient(110deg,transparent 34%,#e7c1841b 48%,transparent 62%);transform:rotate(-8deg);pointer-events:none}
    .studio:after{content:"";position:absolute;left:2%;right:2%;bottom:10px;height:22%;border-radius:50%;background:radial-gradient(ellipse,#bd7c5772 0,#4e2d3f2c 50%,transparent 73%);filter:blur(12px);pointer-events:none}
    .station-head{position:absolute;top:9px;left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;gap:8px;align-items:center;color:#ffe2af;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #000}.station-step{color:#d4b9bb;letter-spacing:0;text-align:right}
    .counter{position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(180deg,#4b3040,#1d1420 38%,#0f0a11);border-top:2px solid #a8735a;box-shadow:0 -5px 20px #efae6444,inset 0 2px 0 #fff1bd24;z-index:0}
    .drink{position:absolute;z-index:2;left:clamp(6px,3%,24px);bottom:1%;width:min(64%,310px);aspect-ratio:2/3;filter:drop-shadow(0 12px 15px #05020cce);transform-origin:50% 78%}
    .drink-glow{position:absolute;inset:25% 6% 5%;border-radius:50%;background:radial-gradient(ellipse,var(--glow,#db915d88),transparent 72%);filter:blur(18px);opacity:.45;transition:opacity .6s}
    .liquid-mask{position:absolute;left:19%;top:35%;width:62%;height:53%;clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);overflow:hidden;z-index:1;transition:top .5s,height .5s,left .5s,width .5s}.drink.sealed .liquid-mask{left:22%;top:41%;width:56%;height:47%}
    .liquid{position:absolute;left:0;right:0;bottom:0;height:0;overflow:hidden;background:linear-gradient(90deg,#13080b 0%,var(--fluid,#723011) 16%,var(--fluid-light,#b2652c) 50%,var(--fluid,#723011) 85%,#18090c 100%);box-shadow:inset 12px 0 17px #1b0c0b79,inset -8px 0 16px #1b0c0b79;transition:height 1.05s cubic-bezier(.2,.55,.2,1),background 1s}
    .liquid:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 12px,#fff5cc12 14px 16px,transparent 19px 35px),radial-gradient(ellipse at 57% 26%,#fff6d129,transparent 35%);mix-blend-mode:screen;opacity:.65}
    .liquid:after{content:"";position:absolute;left:-10%;right:-10%;top:-5px;height:17px;border-radius:50%;background:linear-gradient(90deg,#35201c,var(--fluid-light,#c88045) 40%,#ffe6a385 58%,#3d241e);box-shadow:0 2px 9px #fff2cf62;animation:surface 3s ease-in-out infinite}
    .cream-swirl{position:absolute;inset:-20% 0 0;opacity:0;background:radial-gradient(ellipse at 42% 38%,#fff8dbad 0,#f6e8c94a 22%,transparent 49%),repeating-conic-gradient(from 20deg at 48% 45%,transparent 0 17deg,#ffefd04a 24deg 38deg,transparent 54deg 72deg);mix-blend-mode:screen;transform:scale(.6) rotate(-15deg);transition:opacity .3s,transform 1.1s}.cream-swirl.show{opacity:.85;transform:scale(1.25) rotate(28deg)}
    .bubbles{position:absolute;inset:0;pointer-events:none}.bubble{position:absolute;width:var(--size);height:var(--size);left:var(--x);bottom:-6px;border:1px solid #fff6d589;border-radius:50%;box-shadow:inset -2px -2px 3px #fff7c37a;opacity:0;animation:bubble-up var(--duration) ease-out var(--delay) forwards}
    .toppings-layer{position:absolute;inset:0;z-index:2;pointer-events:none}.topping{position:absolute;left:var(--x);bottom:var(--y);width:var(--size);height:var(--size);transform:translateY(-230px) rotate(var(--rot));opacity:0;box-shadow:0 2px 4px #150b0a9e,inset -2px -3px 5px #190d0d8a;animation:topping-drop .64s cubic-bezier(.2,.75,.26,1.07) var(--delay) forwards}
    .topping:after{content:"";position:absolute;left:18%;top:13%;width:33%;height:20%;border-radius:50%;background:#fffbd1ad;filter:blur(1px)}
    .topping.pearl,.topping.boba{border-radius:50%;background:radial-gradient(circle at 32% 25%,#bd856b,#603124 40%,#190d12 83%)}.topping.boba{background:radial-gradient(circle at 30% 22%,#b27353,#4c251f 38%,#100b10 84%)}
    .topping.white-pearl{border-radius:50%;background:radial-gradient(circle at 29% 24%,#fffef6,#e5d6c6 50%,#a49286 92%)}.topping.jelly{border-radius:4px;transform:translateY(-230px) rotate(var(--rot)) skew(-7deg);background:linear-gradient(135deg,#6d6079,#1f1628 48%,#08070c);border:1px solid #ab9aaa}
    .topping.pudding{border-radius:4px;background:linear-gradient(145deg,#fff1a0,#efb739 70%,#a96920);border:1px solid #ffdd69}.topping.bean{border-radius:49%;background:radial-gradient(circle at 30% 20%,#e29e80,#973f33 55%,#4f2227)}
    .topping.coconut{border-radius:4px;background:linear-gradient(130deg,#ffffffeb,#daf6f2ad 52%,#9bc0c0);border:1px solid #fff}.topping.yellow-jelly{border-radius:4px;background:linear-gradient(130deg,#fff39a,#f2c33f 53%,#c78d23);border:1px solid #ffe57e}
    .topping.mung{border-radius:50%;background:radial-gradient(circle at 30% 20%,#d8dc8b,#748b3d 55%,#394a25)}.topping.peanut{border-radius:48% 45% 48% 44%;background:radial-gradient(circle at 30% 20%,#ffdb94,#c48848 60%,#754525)}
    .cup-shell{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;pointer-events:none;transition:opacity .4s,transform .55s}.cup-sealed{opacity:0;transform:translateY(-12px)}.drink.sealed .cup-open{opacity:0}.drink.sealed .cup-sealed{opacity:1;transform:translateY(0)}.drink.shake{animation:shake .7s ease-in-out}.drink.reveal{animation:reveal .85s ease-out}.drink.reveal .drink-glow{opacity:1}
    .pour{position:absolute;z-index:5;left:16%;top:9%;width:32%;height:62%;pointer-events:none;opacity:0;transition:opacity .2s}.pour.active{opacity:1}.pour-vessel{position:absolute;top:0;left:0;width:clamp(62px,8vw,105px);aspect-ratio:1;background:url('../assets/avatar/cup/pour-pitcher-gold-v1.png') center/contain no-repeat;filter:drop-shadow(0 7px 7px #070409a8);animation:pitcher-tilt .9s ease-in-out infinite}
    .pour-stream{position:absolute;left:74%;top:52px;width:8px;height:57%;border-radius:50% 32% 35% 50%;background:linear-gradient(90deg,#fff9d174,var(--stream,#b76530) 36%,var(--stream-light,#e59b5b) 75%,#fff2be91);box-shadow:0 0 9px var(--stream,#b76530);transform:rotate(4deg) scaleY(0);transform-origin:50% 0;animation:stream 1s ease-in-out infinite}.pour-drop{position:absolute;left:79%;top:82%;width:7px;height:11px;border-radius:50% 50% 60% 60%;background:var(--stream,#b76530);animation:drip .65s linear infinite}
    .falling-layer{position:absolute;inset:0;z-index:5;pointer-events:none}.topping.falling{bottom:auto;top:var(--top);animation:rain-drop .57s ease-in var(--delay) forwards}
    .ingredient-flash{position:absolute;z-index:6;left:20%;top:28%;display:flex;align-items:center;gap:5px;padding:3px 7px 3px 3px;border-radius:8px;background:#fff3dde8;color:#533024;font-size:11px;font-weight:800;box-shadow:0 0 22px #ffd18b;opacity:0;pointer-events:none}.flash-art{width:28px;height:36px;flex:none;border-radius:4px;background-image:var(--art-url);background-size:var(--art-size);background-position:var(--art-x) var(--art-y);background-repeat:no-repeat;box-shadow:0 1px 4px #0008}.ingredient-flash.show{animation:flash-label .8s ease-out forwards}
    .product-copy{position:absolute;z-index:4;left:57%;right:8px;top:50%;transform:translateY(-50%);min-width:0;padding:9px 7px;border-radius:10px;background:linear-gradient(90deg,#1c1525b8,#1c15258c);border:1px solid #e1ad6347;text-shadow:0 2px 5px #0009}.eyebrow{font-size:10px;color:#f4c981;letter-spacing:.13em}.product-name{margin:5px 0 6px;color:#fff1cf;font-size:clamp(17px,2vw,25px);line-height:1.15;overflow-wrap:anywhere}.product-note{margin:0;color:#e0cfce;font-size:11px;line-height:1.4;overflow-wrap:anywhere}
    .progress{height:3px;border-radius:99px;background:#493244;overflow:hidden}.progress-fill{width:0;height:100%;background:linear-gradient(90deg,#d88842,#ffe2a4);box-shadow:0 0 9px #e9b774;transition:width .35s}.actions{display:flex;align-items:center;gap:8px;margin-top:5px}.craft{flex:1;min-height:41px;border:1px solid #ffcf80;border-radius:9px;background:linear-gradient(#b87742,#854627);color:#fff9e7;font-weight:800;letter-spacing:.12em;box-shadow:0 2px 0 #54291d,0 0 17px #c8833d5e;cursor:pointer}.craft:disabled{opacity:.66;cursor:default}.message{margin:2px 0 0;min-height:14px;color:#dac8cf;font-size:10px;line-height:1.3}
    @keyframes surface{50%{transform:translateY(3px) scaleX(.93)}}@keyframes bubble-up{5%{opacity:.8}100%{opacity:0;transform:translate(var(--drift),-155px) scale(1.5)}}@keyframes topping-drop{0%{opacity:0;transform:translateY(-230px) rotate(var(--rot)) scale(.7)}10%{opacity:1}75%{transform:translateY(8px) rotate(var(--rot)) scale(1.1)}100%{opacity:1;transform:translateY(0) rotate(var(--rot)) scale(1)}}@keyframes rain-drop{0%{opacity:0;transform:translateY(-25px) rotate(var(--rot)) scale(.75)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(var(--fall)) rotate(var(--rot)) scale(1)}}
    @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}@keyframes reveal{0%{transform:scale(.82);filter:brightness(2.3)}55%{transform:scale(1.08);filter:brightness(1.4)}100%{transform:scale(1);filter:brightness(1)}}@keyframes stream{0%,100%{transform:rotate(4deg) scaleY(.92)}50%{transform:rotate(5deg) scaleY(1.05)}}@keyframes pitcher-tilt{50%{transform:rotate(3deg)}}@keyframes drip{to{transform:translate(5px,55px);opacity:0}}@keyframes flash-label{0%{opacity:0;transform:translateY(8px) scale(.8)}25%,70%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @media(max-height:440px){.app{gap:5px}header{min-height:27px}.ingredients,.result{padding:6px 8px}.ingredients{gap:3px}.shelf-head{min-height:16px}.pick{min-height:59px}.pick-art{width:35px;height:46px}.topping-grid .pick{min-height:59px}.topping-grid .pick-art{width:32px;height:40px}.result{gap:3px}.recipe{min-height:22px}.station-head{top:5px}.drink{width:min(50%,160px);bottom:1%}.product-copy{left:55%;padding:5px}.product-name{font-size:17px;margin:3px 0}.product-note{font-size:10px}.craft{min-height:35px}.pour-vessel{width:62px}.pour-stream{top:34px}.subtle{display:none}}
    @media(max-width:700px) and (orientation:landscape){.ingredients{overflow-y:auto}.top-shelves{gap:4px}.choice-row{gap:3px}.choice-row .pick{flex-direction:column;gap:1px}.choice-row .pick-art{width:28px;height:37px}.choice-row .pick-name{font-size:9px}.topping-grid{gap:3px}.topping-grid .pick-art{width:27px;height:35px}.topping-grid .pick-name{font-size:9px}.drink{width:min(48%,145px)}.product-copy{left:53%}}
    @media(max-width:700px) and (orientation:portrait){main{grid-template-columns:1fr}.panel{min-height:290px}.result{min-height:330px}.subtle{display:none}.drink{width:min(42%,180px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><h1>珍奶工坊・飲料合成</h1><span class="subtle">選原料 → 倒茶 → 加奶 → 落料 → 成品</span></header>
    <main>
      <section class="panel ingredients" aria-label="選擇原料">
        <div class="top-shelves">
          <div class="shelf"><div class="shelf-head"><h2>茶底</h2><span class="rule">必選 1</span></div><div id="tea" class="choice-row"></div></div>
          <div class="shelf"><div class="shelf-head"><h2>乳品</h2><span class="rule">可不加</span></div><div id="dairy" class="choice-row"></div></div>
        </div>
        <div class="shelf-head"><h2>配料</h2><span class="rule">最多 2 種</span></div><div id="toppings" class="topping-grid"></div>
      </section>
      <section id="result" class="panel result" aria-label="飲料合成與製作結果">
        <div id="recipe" class="recipe"></div>
        <div id="studio" class="studio">
          <div class="station-head"><strong>手作調飲台</strong><span id="station-step" class="station-step">挑選原料後開始製作</span></div>
          <div class="counter"></div>
          <div id="drink" class="drink" aria-hidden="true">
            <div class="drink-glow"></div>
            <div class="liquid-mask"><div id="liquid" class="liquid"><div id="cream-swirl" class="cream-swirl"></div><div id="bubbles" class="bubbles"></div></div><div id="toppings-layer" class="toppings-layer"></div></div>
            <img class="cup-shell cup-open" src="../assets/avatar/cup/cup-open-gold-v1.png" alt="">
            <img class="cup-shell cup-sealed" src="../assets/avatar/cup/cup-shell-gold-v1.png" alt="">
          </div>
          <div id="pour" class="pour"><div class="pour-vessel"></div><div class="pour-stream"></div><div class="pour-drop"></div></div>
          <div id="falling-layer" class="falling-layer"></div>
          <div id="ingredient-flash" class="ingredient-flash"></div>
          <div class="product-copy" aria-live="polite"><div class="eyebrow">製作結果</div><h2 id="product-name" class="product-name">等待調製</h2><p id="product-note" class="product-note">選好原料，親手調出你的飲料。</p></div>
        </div>
        <div><div class="progress"><div id="progress-fill" class="progress-fill"></div></div><div class="actions"><button id="craft" class="craft" type="button">開始製作</button></div><p id="message" class="message" aria-live="polite">概念預覽・原料卡不會扣除</p></div>
      </section>
    </main>
  </div>
  <script>
    const ingredients=[
      {id:'black-tea',name:'紅茶',group:'tea',sheet:1,spot:0},{id:'green-tea',name:'綠茶',group:'tea',sheet:1,spot:1},
      {id:'milk',name:'牛奶',group:'dairy',sheet:1,spot:2},{id:'creamer',name:'奶精',group:'dairy',sheet:1,spot:3},
      {id:'pearl',name:'珍珠',group:'toppings',sheet:1,spot:4,shape:'pearl'},{id:'grass-jelly',name:'仙草',group:'toppings',sheet:1,spot:5,shape:'jelly'},
      {id:'pudding',name:'布丁',group:'toppings',sheet:1,spot:6,shape:'pudding'},{id:'red-bean',name:'紅豆',group:'toppings',sheet:1,spot:7,shape:'bean'},
      {id:'coconut',name:'椰果',group:'toppings',sheet:1,spot:8,shape:'coconut'},{id:'white-pearl',name:'白玉珍珠',group:'toppings',sheet:2,spot:0,shape:'white-pearl'},
      {id:'boba',name:'波霸',group:'toppings',sheet:2,spot:1,shape:'boba'},{id:'mung-bean',name:'綠豆',group:'toppings',sheet:2,spot:2,shape:'mung'},
      {id:'yellow-jelly',name:'粉粿',group:'toppings',sheet:2,spot:3,shape:'yellow-jelly'},{id:'peanut',name:'花生',group:'toppings',sheet:2,spot:4,shape:'peanut'}
    ];
    const byId=Object.fromEntries(ingredients.map(item=>[item.id,item]));
    const state={tea:'black-tea',dairy:'milk',toppings:['pearl'],busy:false};
    const $=id=>document.getElementById(id);
    const recipeEl=$('recipe'),liquid=$('liquid'),cream=$('cream-swirl'),bubbles=$('bubbles'),toppingLayer=$('toppings-layer');
    const drink=$('drink'),pour=$('pour'),flash=$('ingredient-flash'),falling=$('falling-layer'),studio=$('studio'),progress=$('progress-fill'),step=$('station-step');
    const nameEl=$('product-name'),noteEl=$('product-note'),messageEl=$('message'),craftBtn=$('craft');
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
    const artStyle=item=>{
      if(item.sheet===1)return `--art-url:url('../assets/cards/concepts/ingredients-base-01.png');--art-size:340% 340%;--art-x:${[5,50,95][item.spot%3]}%;--art-y:${[2,49,95][Math.floor(item.spot/3)]}%`;
      const x=[2,50,98,18,82][item.spot],y=[3,3,3,100,100][item.spot];
      return `--art-url:url('../assets/cards/concepts/ingredients-toppings-02.png');--art-size:310% 235%;--art-x:${x}%;--art-y:${y}%`;
    };
    for(const item of ingredients){
      const button=document.createElement('button');button.type='button';button.className='pick';button.dataset.id=item.id;button.setAttribute('aria-pressed','false');
      button.innerHTML=`<span class="pick-art" style="${artStyle(item)}" aria-hidden="true"></span><span class="pick-name">${item.name}</span>`;
      button.addEventListener('click',()=>select(item));$(item.group).append(button);
    }
    function select(item){
      if(state.busy)return;
      if(item.group==='tea')state.tea=item.id;
      else if(item.group==='dairy')state.dairy=state.dairy===item.id?null:item.id;
      else if(state.toppings.includes(item.id))state.toppings=state.toppings.filter(id=>id!==item.id);
      else if(state.toppings.length<2)state.toppings.push(item.id);
      else{messageEl.textContent='最多兩種配料，請先取消一種。';return}
      resetStage();render();
    }
    function recipeName(){
      const tea=state.tea==='black-tea'?'紅茶':'綠茶';
      const base=state.dairy==='milk'?(tea==='紅茶'?'鮮奶茶':'鮮奶綠'):state.dairy==='creamer'?(tea==='紅茶'?'奶茶':'奶綠'):tea;
      return state.toppings.map(id=>byId[id].name).join('・')+base;
    }
    function render(){
      document.querySelectorAll('.pick').forEach(button=>{
        const item=byId[button.dataset.id];const selected=item.group==='tea'?state.tea===item.id:item.group==='dairy'?state.dairy===item.id:state.toppings.includes(item.id);
        button.setAttribute('aria-pressed',String(selected));button.disabled=state.busy;
      });
      const slots=[byId[state.tea].name,state.dairy?byId[state.dairy].name:'不加乳品',...state.toppings.map(id=>byId[id].name)];
      recipeEl.innerHTML=slots.map((label,i)=>`<span class="slot ${i===1&&!state.dairy?'empty':''}">${label}</span>`).join('');
    }
    function resetStage(){
      liquid.style.height='0';cream.classList.remove('show');bubbles.replaceChildren();toppingLayer.replaceChildren();falling.replaceChildren();drink.classList.remove('shake','reveal','sealed');pour.classList.remove('active');flash.classList.remove('show');
      progress.style.width='0';step.textContent='挑選原料後開始製作';nameEl.textContent='等待調製';noteEl.textContent='選好原料，親手調出你的飲料。';messageEl.textContent='概念預覽・原料卡不會扣除';craftBtn.textContent='開始製作';
    }
    const colors={
      'black-tea':{none:['#4e1f0d','#af551d'],milk:['#7c3f1f','#c58953'],creamer:['#713116','#bd7440']},
      'green-tea':{none:['#415516','#8aa52e'],milk:['#596b2d','#adbd70'],creamer:['#4b6123','#a1b65d']}
    };
    function setFluid(dairy){
      const [dark,light]=colors[state.tea][dairy||'none'];liquid.style.setProperty('--fluid',dark);liquid.style.setProperty('--fluid-light',light);
      drink.style.setProperty('--glow',`${light}99`);
    }
    function showFlash(label,id){
      const item=byId[id];flash.replaceChildren();
      if(item){const art=document.createElement('span');art.className='flash-art';art.setAttribute('style',artStyle(item));flash.append(art)}
      const name=document.createElement('span');name.textContent=label;flash.append(name);
      flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');
    }
    function addBubbles(count){
      for(let i=0;i<count;i++){
        const b=document.createElement('span');b.className='bubble';b.style.setProperty('--x',`${16+(i*47)%68}%`);b.style.setProperty('--size',`${3+i%4}px`);b.style.setProperty('--delay',`${i*70}ms`);b.style.setProperty('--duration',`${850+i*110}ms`);b.style.setProperty('--drift',`${i%2?8:-8}px`);bubbles.append(b);
      }
    }
    function addTopping(id,index,instant=false){
      const item=byId[id];const count=item.shape==='boba'?15:item.shape==='pearl'||item.shape==='white-pearl'?18:11;
      const scale=drink.getBoundingClientRect().width/220;
      for(let i=0;i<count;i++){
        const piece=document.createElement('span');piece.className=`topping ${item.shape}`;
        piece.style.setProperty('--x',`${9+((i*37+index*17)%77)}%`);
        piece.style.setProperty('--y',`${5+Math.floor(i/5)*9+index*6}%`);
        const base=item.shape==='boba'?17:item.shape==='pearl'||item.shape==='white-pearl'?12:14;
        piece.style.setProperty('--size',`${Math.max(10,Math.round(base*scale))}px`);
        piece.style.setProperty('--rot',`${(i*31+index*17)%80-40}deg`);
        piece.style.setProperty('--delay',instant?'0ms':`${i*48}ms`);
        toppingLayer.append(piece);
      }
    }
    function rainTopping(id,index){
      if(reduced())return;
      const item=byId[id],drinkBox=drink.getBoundingClientRect(),stageBox=studio.getBoundingClientRect();
      const center=drinkBox.left-stageBox.left+drinkBox.width/2;
      const rim=drinkBox.top-stageBox.top+drinkBox.height*.2;
      for(let i=0;i<9;i++){
        const piece=document.createElement('span');piece.className=`topping falling ${item.shape}`;
        piece.style.setProperty('--x',`${center-38+(i*19+index*13)%76}px`);
        piece.style.setProperty('--top',`${Math.max(15,rim-95-(i%3)*12)}px`);
        piece.style.setProperty('--fall',`${95+(i%3)*12}px`);
        piece.style.setProperty('--size',`${item.shape==='boba'?14:11}px`);
        piece.style.setProperty('--rot',`${i*23-55}deg`);
        piece.style.setProperty('--delay',`${i*47}ms`);falling.append(piece);
        setTimeout(()=>piece.remove(),1100);
      }
    }
    async function pourStep(label,id,color,light,duration){
      step.textContent=label;messageEl.textContent=label;showFlash(label,id);pour.style.setProperty('--stream',color);pour.style.setProperty('--stream-light',light);
      if(!reduced())pour.classList.add('active');await sleep(reduced()?30:duration);pour.classList.remove('active');
    }
    async function craft(){
      if(state.busy)return;
      state.busy=true;resetStage();render();craftBtn.disabled=true;
      const fast=reduced();const total=2+(state.dairy?1:0)+state.toppings.length;let done=0;
      setFluid(null);liquid.style.transitionDuration=fast?'0ms':'1050ms';
      const teaName=byId[state.tea].name;
      const teaPour=pourStep(`倒入${teaName}`,state.tea,state.tea==='black-tea'?'#9b4e1c':'#809629',state.tea==='black-tea'?'#d78038':'#bad252',fast?30:930);
      liquid.style.height='90%';addBubbles(8);await teaPour;progress.style.width=`${(++done/total)*100}%`;
      await sleep(fast?20:450);
      if(state.dairy){
        const milkPour=pourStep(`加入${byId[state.dairy].name}`,state.dairy,'#f8ead0','#ffffff',fast?30:700);
        setFluid(state.dairy);liquid.style.height='94%';cream.classList.add('show');addBubbles(6);await milkPour;progress.style.width=`${(++done/total)*100}%`;
        await sleep(fast?20:380);
      }
      for(let i=0;i<state.toppings.length;i++){
        const id=state.toppings[i];step.textContent=`加入${byId[id].name}`;messageEl.textContent=`${byId[id].name}正在落入杯中`;showFlash(byId[id].name,id);
        rainTopping(id,i);await sleep(fast?10:330);addTopping(id,i,fast);addBubbles(5);progress.style.width=`${(++done/total)*100}%`;
        await sleep(fast?10:520);
      }
      step.textContent='輕搖融合';messageEl.textContent='茶香與配料融合中';drink.classList.add('shake');progress.style.width='100%';
      await sleep(fast?30:780);drink.classList.remove('shake');drink.classList.add('sealed');liquid.style.height='97%';
      await sleep(fast?20:430);drink.classList.add('reveal');
      nameEl.textContent=recipeName();noteEl.textContent=[teaName,state.dairy?byId[state.dairy].name:'清茶',...state.toppings.map(id=>byId[id].name)].join('・');
      step.textContent='調製完成';messageEl.textContent='成品完成・可以更換原料再製作';craftBtn.textContent='再次製作';craftBtn.disabled=false;state.busy=false;render();
    }
    craftBtn.addEventListener('click',craft);render();
  </script>
</body>
</html>
