<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b16">
  <title>珍奶卡片抽卡動畫預覽</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f8eed8;background:#0d0b16}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 38%,#29203e 0%,#15101f 47%,#090811 100%)}
    button{font:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #fbd681;outline-offset:3px}
    .app{min-height:100dvh;max-width:1280px;margin:auto;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
    h1{font-size:clamp(16px,2.3vw,23px);font-weight:700;margin:0;letter-spacing:.06em;color:#f6ddb0}
    .note{font-size:12px;color:#bfb4d1;white-space:nowrap}
    .stage{position:relative;flex:1;min-height:245px;display:grid;place-items:center;border:1px solid #a887594d;border-radius:16px;background:radial-gradient(circle at center,#42335899 0%,#20192e88 34%,#110e1ba8 72%);isolation:isolate;overflow:hidden}
    .stage:before{content:"";position:absolute;inset:8%;border:1px solid #ddc18820;border-radius:50%;box-shadow:0 0 60px #c5a6ec1c,inset 0 0 60px #e7c88912;pointer-events:none}
    .stage:after{content:"";position:absolute;width:min(62vw,480px);aspect-ratio:1;border:2px solid #dfb66616;border-radius:50%;box-shadow:0 0 0 34px #bf91e30a,0 0 0 72px #c7a0f005;pointer-events:none}
    .status{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:10;font-size:12px;letter-spacing:.16em;color:#e4d3ff;white-space:nowrap}
    .impact-field{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;--impact-color:#f9d878;--impact-soft:#e9aa3c99}
    .stage.impact-purple .impact-field{--impact-color:#e7acff;--impact-soft:#9943ffbb}
    .stage.impact-red .impact-field{--impact-color:#ff9b6b;--impact-soft:#f83632aa}
    .impact-dim,.impact-flash,.impact-rays,.impact-ring,.impact-sparks{position:absolute;pointer-events:none;opacity:0}
    .impact-dim{inset:0;background:radial-gradient(circle at center,transparent 0%,#05030bc9 76%)}
    .impact-flash{inset:-15%;background:radial-gradient(circle at var(--impact-x,50%) var(--impact-y,50%),#fff 0%,var(--impact-color) 12%,var(--impact-soft) 26%,transparent 62%);mix-blend-mode:screen}
    .impact-rays{left:var(--impact-x,50%);top:var(--impact-y,50%);width:min(88vh,750px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.25) rotate(-18deg);border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0deg 11deg,var(--impact-color) 12deg 13deg,transparent 14deg 30deg);-webkit-mask-image:radial-gradient(circle,transparent 0 28%,#000 38% 76%,transparent 90%);mask-image:radial-gradient(circle,transparent 0 28%,#000 38% 76%,transparent 90%);filter:drop-shadow(0 0 10px var(--impact-color))}
    .impact-ring{left:var(--impact-x,50%);top:var(--impact-y,50%);width:min(62vh,510px);aspect-ratio:1;border:4px solid var(--impact-color);border-radius:50%;box-shadow:0 0 13px var(--impact-color),inset 0 0 14px var(--impact-color);transform:translate(-50%,-50%) scale(.2)}
    .impact-ring.second{border-width:2px}
    .impact-sparks{inset:0;background:radial-gradient(circle at 13% 24%,#fff 0 2px,transparent 4px),radial-gradient(circle at 81% 14%,var(--impact-color) 0 3px,transparent 6px),radial-gradient(circle at 24% 76%,var(--impact-color) 0 2px,transparent 6px),radial-gradient(circle at 90% 78%,#fff 0 2px,transparent 5px),radial-gradient(circle at 45% 13%,var(--impact-color) 0 2px,transparent 5px),radial-gradient(circle at 60% 85%,var(--impact-color) 0 3px,transparent 6px)}
    .impact-label{position:absolute;top:10px;left:14px;z-index:9;color:var(--impact-color);font-size:clamp(15px,2.4vw,24px);font-weight:900;letter-spacing:.12em;text-shadow:0 0 12px var(--impact-color),0 0 30px var(--impact-soft);opacity:0;white-space:nowrap}
    .lightning-canvas{position:absolute;inset:0;z-index:8;width:100%;height:100%;pointer-events:none}
    .stage.impact-on .impact-dim{animation:impact-dim .95s ease-out both}
    .stage.impact-on .impact-flash{animation:impact-flash 1.05s ease-out both}
    .stage.impact-on .impact-rays{animation:impact-rays 1.2s ease-out both}
    .stage.impact-on .impact-ring{animation:impact-ring 1.1s ease-out both}
    .stage.impact-on .impact-ring.second{animation-delay:.14s}
    .stage.impact-on .impact-sparks{animation:impact-sparks 1.1s ease-out both}
    .stage.impact-on .impact-label{animation:impact-label 1.05s ease-out both}
    .stage.impact-on .cards{animation:arena-shake .65s ease-out}
    .cards{position:relative;z-index:2;display:grid;place-items:center;width:100%;height:100%;padding:24px 6px 8px}
    .cards.ten{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,max-content);align-content:center;gap:18px 7px;width:min(100%,670px);margin:auto;padding:20px 12px 5px}
    .card{position:relative;display:block;width:min(34vh,232px);aspect-ratio:2/3;perspective:900px;filter:drop-shadow(0 9px 12px #05040a99);transform:translateZ(0);}
    .ten .card{width:min(10.5vw,104px,calc(100% - 2px),18vh);align-self:center;justify-self:center}
    .card.deal{animation:deal .48s cubic-bezier(.18,.88,.3,1.18) both}
    .card.instant{animation:none!important}
    .card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.73,.15,1.08)}
    .card.instant .inner{transition:none!important}
    .card.revealed .inner{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;overflow:hidden;border-radius:5%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-position:center;background-repeat:no-repeat;background-size:100% 100%;}
    .back{background-image:var(--back)}
    .front{transform:rotateY(180deg);background-image:url('../assets/cards/concepts/ingredients-base-01.png');background-size:340% 340%;background-position:var(--front-x) var(--front-y)}
    .glow{position:absolute;z-index:-1;inset:-16%;border-radius:30%;opacity:0;pointer-events:none;box-shadow:0 0 24px 13px var(--aura),0 0 80px 40px var(--aura-soft);}
    .card.burst .glow{animation:glow 1.3s ease-out both}
    .card.blue{--aura:#59adff;--aura-soft:#368cf944}.card.black{--aura:#ffdf75;--aura-soft:#e0a52255}.card.purple{--aura:#d47aff;--aura-soft:#973dff66}.card.red{--aura:#ff6850;--aura-soft:#ff301e66}
    .card.burst.special{z-index:6;animation:rarity-pop .95s cubic-bezier(.18,.78,.2,1.08) both}
    .shine{position:absolute;z-index:5;inset:-35%;opacity:0;pointer-events:none;background:radial-gradient(circle,#fff 0%,var(--aura) 16%,transparent 60%);mix-blend-mode:screen}
    .card.burst.special .shine{animation:flash .9s ease-out both}
    .tag{position:absolute;z-index:5;left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.09em;color:var(--aura);text-shadow:0 0 11px var(--aura);opacity:0}
    .card.revealed .tag{animation:tag-in .4s .4s both}
    .ten .tag{bottom:-14px;font-size:10px}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .tiers,.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .caption{font-size:12px;color:#cec3d6;margin-right:3px}
    .tier,.action{border:1px solid #8a7193;border-radius:9px;background:#2b203b;color:#f8ebf6;padding:7px 12px;min-height:38px;min-width:44px;cursor:pointer}
    .tier.selected{border-color:#f8d88d;box-shadow:0 0 0 1px #f8d88d,0 0 15px #f2bf6e55}
    .tier[data-tier=blue]{color:#9ccafa}.tier[data-tier=black]{color:#ffe49b}.tier[data-tier=purple]{color:#ddaaff}.tier[data-tier=red]{color:#ffafa3}
    .action{background:linear-gradient(#835a39,#5f3b29);border-color:#c89661;color:#fff2d7;font-weight:700}
    .action.secondary{background:#292232;border-color:#786c81;color:#dcd0df}
    .action:disabled{opacity:.55;cursor:default}
    .hint{font-size:11px;color:#a89aae;margin:0;line-height:1.2}
    @keyframes deal{from{opacity:0;transform:translateY(-38px) scale(.74) rotate(-8deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
    @keyframes glow{0%{opacity:0;transform:scale(.55)}16%{opacity:1;transform:scale(1.28)}45%{opacity:.95;transform:scale(1.12)}100%{opacity:.5;transform:scale(1)}}
    @keyframes rarity-pop{0%{transform:scale(1)}17%{transform:scale(1.22)}40%{transform:scale(.96)}62%{transform:scale(1.08)}100%{transform:scale(1)}}
    @keyframes flash{0%{opacity:0;transform:scale(.15)}12%{opacity:.85}28%{opacity:0;transform:scale(.7)}43%{opacity:.45}100%{opacity:0;transform:scale(1.4)}}
    @keyframes impact-dim{0%{opacity:0}18%{opacity:.72}70%{opacity:.48}100%{opacity:0}}
    @keyframes impact-flash{0%{opacity:0;transform:scale(.4)}9%{opacity:.95}20%{opacity:.12}34%{opacity:.52}55%{opacity:.12}100%{opacity:0;transform:scale(1.25)}}
    @keyframes impact-rays{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-18deg)}22%{opacity:.8}58%{opacity:.52}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35) rotate(14deg)}}
    @keyframes impact-ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}14%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
    @keyframes impact-sparks{0%{opacity:0;transform:scale(.55) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(14deg)}}
    @keyframes impact-label{0%{opacity:0;transform:translateY(9px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.08)}65%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-7px)}}
    @keyframes arena-shake{0%,100%{transform:translate(0)}12%{transform:translate(-5px,2px)}25%{transform:translate(5px,-2px)}38%{transform:translate(-3px,1px)}52%{transform:translate(3px,-1px)}69%{transform:translate(-1px,0)}}
    @keyframes tag-in{from{opacity:0;transform:translate(-50%,7px)}to{opacity:1;transform:translate(-50%,0)}}
    @media(max-height:440px){.app{gap:5px}.stage{min-height:205px}.card{width:min(31vh,132px)}.ten .card{width:min(10vw,76px,19vh)}.note{display:none}.hint{display:none}.tier,.action{padding:5px 10px;min-height:35px}}
    @media(max-width:700px){.note{display:none}.caption{display:none}.controls{justify-content:center}.tier,.action{padding:6px 8px;min-height:36px}.ten .tag{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.stage.impact-on .impact-flash,.stage.impact-on .impact-rays,.stage.impact-on .impact-ring,.stage.impact-on .impact-sparks{display:none}.stage.impact-on .impact-label{animation:none;opacity:1}}
  </style>
</head>
<body>
  <main class="app">
    <header><h1>珍奶卡片・抽卡動畫預覽</h1><span class="note">橫向手機／點選卡色後試播</span></header>
    <section class="stage" aria-label="抽卡動畫預覽區">
      <div id="status" class="status" aria-live="polite">選擇卡背，點擊單抽或十連抽</div>
      <div class="impact-field" aria-hidden="true"><span class="impact-dim"></span><span class="impact-flash"></span><span class="impact-rays"></span><span class="impact-ring"></span><span class="impact-ring second"></span><span class="impact-sparks"></span><span id="impact-label" class="impact-label"></span></div>
      <div id="cards" class="cards"></div>
      <canvas id="lightning" class="lightning-canvas" aria-hidden="true"></canvas>
    </section>
    <div class="controls">
      <div class="tiers" role="group" aria-label="單抽卡背顏色">
        <span class="caption">單抽預覽：</span>
        <button class="tier selected" type="button" data-tier="blue" aria-pressed="true">一般藍</button>
        <button class="tier" type="button" data-tier="black" aria-pressed="false">特殊黑金</button>
        <button class="tier" type="button" data-tier="purple" aria-pressed="false">特殊紫金</button>
        <button class="tier" type="button" data-tier="red" aria-pressed="false">特殊紅金</button>
      </div>
      <div class="actions">
        <button id="single" class="action" type="button">一抽</button>
        <button id="ten" class="action" type="button">十連抽</button>
        <button id="skip" class="action secondary" type="button" disabled>立即揭曉</button>
      </div>
    </div>
    <p class="hint">十連抽為固定演示組合，用來比較特效與節奏，與正式抽卡機率無關。卡面與稀有度配對也是演示用途。</p>
  </main>
  <script>
    const backs={blue:'../assets/cards/concepts/card-back-blue.png',black:'../assets/cards/concepts/card-back-black-gold.png',purple:'../assets/cards/concepts/card-back-purple-gold.png',red:'../assets/cards/concepts/card-back-red-gold.png'};
    const names={blue:'一般卡',black:'黑金特殊卡',purple:'紫金特殊卡',red:'紅金特殊卡'};
    const calls={black:'黑金降臨',purple:'紫金覺醒',red:'紅金爆發'};
    const frontIndex={blue:0,black:4,purple:5,red:6};
    const stageEl=document.querySelector('.stage');
    const cardsEl=document.getElementById('cards');
    const statusEl=document.getElementById('status');
    const impactLabel=document.getElementById('impact-label');
    const skipBtn=document.getElementById('skip');
    const lightningCanvas=document.getElementById('lightning');
    const lightningCtx=lightningCanvas.getContext('2d');
    const lightningColors={black:'#ffda72',purple:'#d485ff',red:'#ff775b'};
    let selected='blue',timers=[],generation=0,impactVersion=0,lightningFrame=0;
    function later(fn,delay){const id=setTimeout(fn,delay);timers.push(id)}
    function stopLightning(){cancelAnimationFrame(lightningFrame);lightningFrame=0;lightningCtx.clearRect(0,0,lightningCanvas.width,lightningCanvas.height)}
    function jagged(start,end,depth=5){
      let points=[start,end];
      for(let level=0;level<depth;level++){
        const next=[points[0]];
        for(let i=1;i<points.length;i++){
          const a=points[i-1],b=points[i],dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1;
          const offset=(Math.random()-.5)*length*.54;
          next.push({x:(a.x+b.x)/2-dy/length*offset,y:(a.y+b.y)/2+dx/length*offset},b);
        }
        points=next;
      }
      return points;
    }
    function strokeBolt(points,color,width,alpha,portion=1){
      const end=Math.max(2,Math.ceil((points.length-1)*portion)+1);
      const trace=()=>{lightningCtx.beginPath();lightningCtx.moveTo(points[0].x,points[0].y);for(let i=1;i<end;i++)lightningCtx.lineTo(points[i].x,points[i].y);lightningCtx.stroke()};
      lightningCtx.globalAlpha=alpha*.65;lightningCtx.strokeStyle=color;lightningCtx.lineWidth=width*3.2;lightningCtx.shadowColor=color;lightningCtx.shadowBlur=30;trace();
      lightningCtx.globalAlpha=alpha;lightningCtx.lineWidth=width;lightningCtx.shadowBlur=16;trace();
      lightningCtx.strokeStyle='#fff';lightningCtx.lineWidth=Math.max(1.4,width*.3);lightningCtx.shadowColor='#fff';lightningCtx.shadowBlur=6;trace();
    }
    function startLightning(tier,card){
      stopLightning();
      if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const box=lightningCanvas.getBoundingClientRect(),cardBox=card.getBoundingClientRect();
      const ratio=Math.min(devicePixelRatio||1,2),width=box.width,height=box.height;
      lightningCanvas.width=Math.round(width*ratio);lightningCanvas.height=Math.round(height*ratio);
      lightningCtx.setTransform(ratio,0,0,ratio,0,0);
      lightningCtx.lineCap='round';lightningCtx.lineJoin='round';
      const target={x:cardBox.left+cardBox.width/2-box.left,y:cardBox.top+cardBox.height*.42-box.top};
      const color=lightningColors[tier],strokeWidth=Math.max(4,Math.min(9,height*.026));
      const particles=Array.from({length:22},()=>({angle:Math.random()*Math.PI*2,speed:50+Math.random()*150,size:1+Math.random()*2.5}));
      const windows=[[0,120],[165,260],[340,460],[530,610]];
      let lastStrike=-1,main=[],branches=[];
      const makeStrike=(i)=>{
        const start={x:Math.max(12,Math.min(width-12,target.x+(Math.random()-.5)*Math.min(width*.3,170))),y:-16};
        main=jagged(start,target,5);
        branches=[.38,.57,.73].map((t,n)=>{
          const from=main[Math.floor(t*(main.length-1))];
          const side=n%2===0?-1:1;
          return jagged(from,{x:from.x+side*(32+Math.random()*Math.min(85,width*.13)),y:Math.min(height+12,from.y+30+Math.random()*80)},3);
        });
        lastStrike=i;
      };
      const begin=performance.now();
      const frame=(now)=>{
        const elapsed=now-begin;
        lightningCtx.clearRect(0,0,width,height);
        const active=windows.findIndex(([a,b])=>elapsed>=a&&elapsed<b);
        if(active>=0){
          if(active!==lastStrike)makeStrike(active);
          const [a,b]=windows[active],age=(elapsed-a)/(b-a),alpha=(active===0?1:.88)*(age<.65?1:(1-age)/.35);
          const portion=active===0?Math.min(1,(elapsed-a)/75):1;
          lightningCtx.globalCompositeOperation='lighter';
          strokeBolt(main,color,strokeWidth,alpha,portion);
          if(portion>.8)branches.forEach((points,i)=>strokeBolt(points,color,strokeWidth*.42,alpha*(.8-i*.1)));
          if(portion>.9){
            lightningCtx.globalAlpha=alpha*.65;
            const radius=16+active*5,halo=lightningCtx.createRadialGradient(target.x,target.y,0,target.x,target.y,radius*2.7);
            halo.addColorStop(0,'#fff');halo.addColorStop(.28,color);halo.addColorStop(1,'transparent');
            lightningCtx.fillStyle=halo;lightningCtx.fillRect(target.x-radius*2.7,target.y-radius*2.7,radius*5.4,radius*5.4);
          }
          lightningCtx.globalAlpha=1;lightningCtx.globalCompositeOperation='source-over';
        }
        if(elapsed<790){
          const travel=elapsed/1000;
          lightningCtx.globalCompositeOperation='lighter';
          particles.forEach(p=>{
            const x=target.x+Math.cos(p.angle)*p.speed*travel,y=target.y+Math.sin(p.angle)*p.speed*travel;
            lightningCtx.globalAlpha=Math.max(0,1-elapsed/790);
            lightningCtx.fillStyle=color;lightningCtx.beginPath();lightningCtx.arc(x,y,p.size,0,Math.PI*2);lightningCtx.fill();
          });
          lightningCtx.globalAlpha=1;lightningCtx.globalCompositeOperation='source-over';
          lightningFrame=requestAnimationFrame(frame);
        }else stopLightning();
      };
      lightningFrame=requestAnimationFrame(frame);
    }
    function clearImpact(){impactVersion++;stopLightning();stageEl.classList.remove('impact-on','impact-black','impact-purple','impact-red');impactLabel.textContent=''}
    function showImpact(tier,card){
      const current=++impactVersion;
      const stageBox=stageEl.getBoundingClientRect(),cardBox=card.getBoundingClientRect();
      stageEl.style.setProperty('--impact-x',`${(cardBox.left+cardBox.width/2-stageBox.left)/stageBox.width*100}%`);
      stageEl.style.setProperty('--impact-y',`${(cardBox.top+cardBox.height*.42-stageBox.top)/stageBox.height*100}%`);
      stageEl.classList.remove('impact-on','impact-black','impact-purple','impact-red');
      void stageEl.offsetWidth;
      stageEl.classList.add('impact-on',`impact-${tier}`);
      impactLabel.textContent=calls[tier];
      startLightning(tier,card);
      later(()=>{if(current===impactVersion)clearImpact()},1250);
    }
    function reset(){generation++;timers.forEach(clearTimeout);timers=[];clearImpact();cardsEl.replaceChildren();cardsEl.className='cards';skipBtn.disabled=true}
    function makeCard(tier,index,delay){
      const el=document.createElement('div');
      el.className=`card ${tier} ${tier==='blue'?'':'special'} deal`;
      el.style.animationDelay=`${delay}ms`;
      el.style.setProperty('--back',`url('${backs[tier]}')`);
      el.style.setProperty('--front-x',`${[5,50,95][index%3]}%`);
      el.style.setProperty('--front-y',`${[2,49,95][Math.floor(index/3)]}%`);
      el.setAttribute('role','img');
      el.setAttribute('aria-label',`${names[tier]}，等待翻開`);
      el.innerHTML=`<span class="glow"></span><span class="inner"><span class="face back"></span><span class="face front"></span></span><span class="shine"></span><span class="tag">${names[tier]}</span>`;
      return el;
    }
    function reveal(el,tier){
      el.classList.add('revealed');
      el.setAttribute('aria-label',`${names[tier]}，已翻開`);
      later(()=>{el.classList.add('burst');if(tier!=='blue')showImpact(tier,el)},320);
    }
    function playSingle(){
      reset();
      const run=generation,tier=selected,el=makeCard(tier,frontIndex[tier],0);
      cardsEl.append(el);
      statusEl.textContent='卡片正在翻開…';
      skipBtn.disabled=false;
      later(()=>{if(run!==generation)return;reveal(el,tier);statusEl.textContent=`揭曉：${names[tier]}`;skipBtn.disabled=true},850);
    }
    function playTen(){
      reset();
      const run=generation;
      cardsEl.classList.add('ten');
      const order=['blue','blue','black','blue','blue','purple','blue','blue','red','blue'];
      const fronts=[0,1,4,2,3,5,6,7,8,0];
      const els=order.map((tier,i)=>{const el=makeCard(tier,fronts[i],(i%5)*60+Math.floor(i/5)*110);cardsEl.append(el);return el});
      statusEl.textContent='十連抽・卡片進場';
      skipBtn.disabled=false;
      let revealAt=760;
      order.forEach((tier,i)=>{
        later(()=>{
          if(run!==generation)return;
          reveal(els[i],tier);
          statusEl.textContent=`十連抽・已揭曉 ${i+1}/10`;
          if(i===9)later(()=>{statusEl.textContent='十連抽完成・黑金 1／紫金 1／紅金 1';skipBtn.disabled=true},400);
        },revealAt);
        revealAt+=tier==='blue'?220:900;
      });
    }
    document.querySelectorAll('.tier').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.tier;document.querySelectorAll('.tier').forEach(x=>{const on=x===btn;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on)});statusEl.textContent=`已選 ${names[selected]}，點擊一抽`;}));
    document.getElementById('single').addEventListener('click',playSingle);
    document.getElementById('ten').addEventListener('click',playTen);
    skipBtn.addEventListener('click',()=>{if(skipBtn.disabled)return;timers.forEach(clearTimeout);timers=[];clearImpact();document.querySelectorAll('.card').forEach(el=>{el.classList.remove('burst');el.classList.add('instant','revealed');el.setAttribute('aria-label',`${names[[...el.classList].find(x=>names[x])]}，已翻開`)});statusEl.textContent='全部揭曉';skipBtn.disabled=true});
  </script>
</body>
</html>
